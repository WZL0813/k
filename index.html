
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模型展示 · 鲁班新声</title>
<style>
/* ========== Reset & Base ========== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "SimSun", "STSong", "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
  background: #EFE2CA;
  color: #525252;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

/* ========== Navbar ========== */
.navbar {
  background: linear-gradient(135deg, #5D4037 0%, #7E4317 60%, #5D4037 100%);
  padding: 0 24px;
  display: flex;
  align-items: center;
  height: 64px;
  box-shadow: 0 2px 12px rgba(93,64,55,0.3);
  position: sticky;
  top: 0;
  z-index: 100;
}
.nav-brand {
  font-size: 22px;
  font-weight: bold;
  color: #EEC492;
  margin-right: 48px;
  letter-spacing: 3px;
}
.nav-tabs {
  display: flex;
  gap: 4px;
  height: 100%;
  align-items: stretch;
}
.nav-tab {
  padding: 0 28px;
  font-size: 16px;
  font-weight: bold;
  color: #EFE2CA;
  cursor: pointer;
  display: flex;
  align-items: center;
  border: none;
  background: transparent;
  border-bottom: 3px solid transparent;
  transition: all 0.25s;
  font-family: inherit;
}
.nav-tab:hover { color: #FFC000; border-bottom-color: #A3561D; }
.nav-tab.active { color: #FFC000; border-bottom-color: #EEC492; }

/* ========== Main Container ========== */
.main-container {
  flex: 1;
  display: flex;
  min-height: 0;
}
#modelView, #databaseView {
  display: flex;
  width: 100%;
}
#databaseView { display: none; }

/* ========== Sidebar ========== */
.sidebar {
  width: 200px;
  background: linear-gradient(180deg, #F2ECE5 0%, #EFE2CA 100%);
  border-right: 1px solid #D7C4A8;
  padding: 16px 0;
  flex-shrink: 0;
  overflow-y: auto;
}
.sidebar-title {
  font-size: 14px;
  font-weight: bold;
  color: #5D4037;
  padding: 0 16px 12px;
  border-bottom: 1px solid #D7C4A8;
  margin-bottom: 8px;
  letter-spacing: 1px;
}
.cat-item {
  padding: 13px 16px;
  font-size: 15px;
  font-weight: bold;
  color: #7E4317;
  cursor: pointer;
  transition: all 0.2s;
  border-left: 4px solid transparent;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.cat-item:hover { background: rgba(163,86,29,0.1); }
.cat-item.active {
  background: rgba(163,86,29,0.15);
  border-left-color: #A3561D;
  color: #5D4037;
}
.cat-count {
  font-size: 12px;
  color: #A67B5B;
  background: #EFE2CA;
  padding: 2px 8px;
  border-radius: 10px;
}

/* ========== Content Area ========== */
.content {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 24px 32px;
  overflow-y: auto;
}
.model-display {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.model-card {
  background: #FFFFFF;
  border-radius: 16px;
  box-shadow: 0 4px 20px rgba(93,64,55,0.12);
  padding: 36px 40px;
  max-width: 600px;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: fadeSlideIn 0.35s ease;
  position: relative;
  overflow: hidden;
}
.model-card::before {
  content: '';
  position: absolute;
  top: -40px;
  right: -40px;
  width: 120px;
  height: 120px;
  background: linear-gradient(135deg, #EEC49233 0%, #A3561D22 100%);
  border-radius: 50%;
  pointer-events: none;
}
@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

.model-visual {
  width: 320px;
  height: 240px;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  background: #F2ECE5;
  border-radius: 12px;
}
.model-visual img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  transition: transform 0.3s ease;
}
.model-visual img:hover { transform: scale(1.05); }

/* Model info */
.model-name {
  font-size: 26px;
  font-weight: bold;
  color: #5D4037;
  margin-bottom: 6px;
  text-align: center;
}
.model-id {
  font-size: 14px;
  color: #A3561D;
  margin-bottom: 16px;
  background: #F5DCBE;
  padding: 4px 16px;
  border-radius: 12px;
  font-weight: bold;
}
.model-desc {
  font-size: 15px;
  color: #525252;
  line-height: 1.8;
  text-align: center;
  max-width: 440px;
  font-weight: bold;
}

/* ========== Nav Arrows ========== */
.arrow-nav {
  display: flex;
  gap: 20px;
  margin-top: 16px;
}
.arrow-btn {
  width: 44px; height: 44px;
  border: 2px solid #A3561D;
  background: #F5DCBE;
  color: #5D4037;
  border-radius: 50%;
  font-size: 20px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex; align-items: center; justify-content: center;
}
.arrow-btn:hover { background: #A3561D; color: #EFE2CA; }
.arrow-btn:active { transform: scale(0.92); }
.arrow-btn:disabled { opacity: 0.35; cursor: default; }

/* ========== Thumbnail Strip ========== */
.thumbnail-strip {
  margin-top: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.thumb-list {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 6px 4px;
  max-width: 580px;
  scroll-behavior: smooth;
}
.thumb-list::-webkit-scrollbar { height: 4px; }
.thumb-list::-webkit-scrollbar-thumb { background: #C9A87C; border-radius: 2px; }
.thumb-item {
  min-width: 72px; height: 72px;
  border-radius: 10px;
  background: #F5DCBE;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: bold;
  color: #7E4317;
  transition: all 0.2s;
  border: 2px solid transparent;
  text-align: center;
  flex-shrink: 0;
}
.thumb-item.active { border-color: #A3561D; background: #EEC492; }
.thumb-item:hover { border-color: #C9A87C; }
.thumb-img {
  width: 48px; height: 48px;
  object-fit: contain;
  margin-bottom: 3px;
  border-radius: 6px;
  background: #F2ECE5;
}
.thumb-label { line-height: 1.2; max-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ========== Database View ========== */
.db-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
  padding: 32px;
  flex: 1;
}
.db-card {
  background: #FFFFFF;
  border-radius: 12px;
  padding: 28px 24px;
  box-shadow: 0 3px 16px rgba(93,64,55,0.1);
  position: relative;
  overflow: hidden;
  transition: transform 0.25s, box-shadow 0.25s;
  border: 1px solid #E8D5C0;
}
.db-card:hover { transform: translateY(-4px); box-shadow: 0 8px 28px rgba(93,64,55,0.18); }
.db-card::before {
  content: '';
  position: absolute;
  top: -16px; right: -16px;
  width: 80px; height: 80px;
  background: linear-gradient(135deg, #EEC49244 0%, #A3561D33 100%);
  clip-path: polygon(100% 0, 100% 100%, 0 100%);
}
.db-name {
  font-size: 20px;
  font-weight: bold;
  color: #5D4037;
  margin-bottom: 8px;
  line-height: 1.4;
}
.db-source {
  font-size: 13px;
  color: #A3561D;
  font-weight: bold;
  margin-bottom: 12px;
  background: #F5DCBE;
  display: inline-block;
  padding: 3px 12px;
  border-radius: 12px;
}
.db-desc {
  font-size: 14px;
  color: #525252;
  line-height: 1.7;
}

/* ========== Footer ========== */
.footer {
  background: linear-gradient(135deg, #5D4037 0%, #7E4317 100%);
  padding: 20px 32px;
  text-align: center;
  color: #EEC492;
  font-size: 14px;
  font-weight: bold;
  letter-spacing: 2px;
}

/* ========== Responsive ========== */
/* Tablet / Small Desktop (≤900px) */
@media (max-width: 900px) {
  .sidebar { width: 140px; }
  .cat-item { font-size: 13px; padding: 10px 12px; }
  .content { padding: 16px; }
  .model-card { padding: 24px 20px; max-width: 500px; }
  .model-visual { width: 240px; height: 180px; }
  .db-grid { grid-template-columns: repeat(2, 1fr); padding: 20px; gap: 16px; }
  .thumb-list { max-width: 460px; }
}

/* Mobile (≤768px) */
@media (max-width: 768px) {
  /* Navbar */
  .navbar {
    padding: 0 12px;
    height: 52px;
  }
  .nav-brand {
    font-size: 15px;
    margin-right: 12px;
    letter-spacing: 1px;
  }
  .nav-tab {
    padding: 0 14px;
    font-size: 14px;
  }

  /* Stack layout */
  .main-container {
    flex-direction: column;
  }
  #modelView {
    flex-direction: column;
  }

  /* Sidebar → horizontal scrollable tabs */
  .sidebar {
    width: 100%;
    flex-shrink: 0;
    border-right: none;
    border-bottom: 1px solid #D7C4A8;
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 6px 8px;
    gap: 4px;
    -webkit-overflow-scrolling: touch;
    height: auto;
    min-height: 52px;
    align-items: center;
  }
  .sidebar::-webkit-scrollbar { height: 3px; }
  .sidebar::-webkit-scrollbar-thumb { background: #C9A87C; border-radius: 2px; }
  .sidebar-title { display: none; }
  .cat-item {
    flex-shrink: 0;
    white-space: nowrap;
    border-left: none;
    border-bottom: 3px solid transparent;
    padding: 10px 14px;
    font-size: 14px;
    border-radius: 4px 4px 0 0;
    min-height: 44px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .cat-item.active {
    border-left: none;
    border-bottom-color: #A3561D;
    background: rgba(163,86,29,0.12);
  }
  .cat-count {
    font-size: 11px;
    padding: 1px 7px;
  }

  /* Content area */
  .content {
    padding: 12px 10px;
  }

  /* Model card: full width, vertical layout */
  .model-card {
    max-width: 100%;
    width: 100%;
    padding: 20px 16px;
    border-radius: 12px;
  }
  .model-card::before {
    width: 80px; height: 80px;
    top: -28px; right: -28px;
  }

  /* Model visual: responsive sizing */
  .model-visual {
    width: min(280px, 80vw);
    height: min(210px, 55vw);
    margin-bottom: 16px;
    border-radius: 10px;
  }

  /* Model info */
  .model-name {
    font-size: 22px;
    margin-bottom: 4px;
  }
  .model-id {
    font-size: 13px;
    margin-bottom: 10px;
    padding: 3px 12px;
  }
  .model-desc {
    font-size: 14px;
    max-width: 100%;
    line-height: 1.7;
  }

  /* Arrow nav: larger touch targets */
  .arrow-nav {
    gap: 16px;
    margin-top: 12px;
  }
  .arrow-btn {
    width: 48px; height: 48px;
    font-size: 22px;
    min-width: 48px; min-height: 48px;
  }

  /* Thumbnail strip → grid layout */
  .thumbnail-strip {
    margin-top: 14px;
    width: 100%;
  }
  .thumb-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(74px, 1fr));
    gap: 8px;
    max-width: 100%;
    overflow-x: visible;
    padding: 4px 2px;
  }
  .thumb-item {
    min-width: 0;
    width: 100%;
    height: 80px;
    flex-shrink: unset;
    border-radius: 8px;
  }
  .thumb-img {
    width: 44px; height: 44px;
    margin-bottom: 2px;
  }
  .thumb-label {
    font-size: 10px;
    max-width: 100%;
  }

  /* Database grid → single column */
  .db-grid {
    grid-template-columns: 1fr;
    gap: 14px;
    padding: 14px 10px;
  }
  .db-card {
    padding: 20px 18px;
    border-radius: 10px;
  }
  .db-name { font-size: 17px; }
  .db-desc { font-size: 13px; line-height: 1.6; }

  /* Footer */
  .footer {
    padding: 14px 16px;
    font-size: 12px;
    letter-spacing: 1px;
  }
}

/* ========== Tab extra style ========== */
.tab-content { display: none; width: 100%; }
.tab-content.active { display: flex; }
#databaseView { flex-direction: column; }
</style>
</head>

  { name:'木构匠人构件参数库', source:'突破：更高速', desc:'支撑自研APP的榫卯构件参数库，包含榫头卯槽装配结构锁定标记、拼接逻辑、尺寸公差，解析错误率＜1%。' },
  { name:'标准课程包 — 153D 动画库', source:'突破：新创意', desc:'三大系列153D动画库，含教案、PPT、教具清单等标准化内容，助力木作技艺传承教学。' },
  { name:'在地匠人合作手册', source:'突破：新创意', desc:'筛选标准、培训流程、劳务协议模板、知识产权约定，激活在地匠人资源。' }
];

/* ========== STATE ========== */
let currentCat = 'airplane';
let currentIdx = 0;

/* ========== DOM REFS ========== */
const sidebar     = document.getElementById('sidebar');
const modelVisual = document.getElementById('modelVisual');
const modelName   = document.getElementById('modelName');
const modelId     = document.getElementById('modelId');
const modelDesc   = document.getElementById('modelDesc');
const thumbList   = document.getElementById('thumbList');
const prevBtn     = document.getElementById('prevBtn');
const nextBtn     = document.getElementById('nextBtn');
const modelView   = document.getElementById('modelView');
const dbView      = document.getElementById('databaseView');
const dbGrid      = document.getElementById('dbGrid');
const modelCard   = document.getElementById('modelCard');

/* ========== RENDER SIDEBAR ========== */
function renderSidebar() {
  sidebar.innerHTML = '<div class="sidebar-title">模型分类</div>' +
    categories.map(c => `
      <div class="cat-item${c.id === currentCat ? ' active' : ''}" data-cat="${c.id}">
        <span>${c.name}</span><span class="cat-count">${c.count}</span>
      </div>
    `).join('');
}

/* ========== RENDER MODEL ========== */
function renderModel() {
  const list = models[currentCat];
  const m = list[currentIdx];
  modelVisual.innerHTML = `<img src="${m.image}" alt="${m.name}" loading="lazy">`;
  modelName.textContent = m.name;
  const catLabel = categories.find(c => c.id === currentCat).name;
  modelId.textContent = catLabel + ' · 第' + (currentIdx + 1) + '/' + list.length + '件';
  modelDesc.textContent = m.desc;
  // animate
  modelCard.style.animation = 'none';
  modelCard.offsetHeight;
  modelCard.style.animation = 'fadeSlideIn 0.35s ease';

  renderThumbs();
  updateArrows();
}

/* ========== RENDER THUMBNAILS ========== */
function renderThumbs() {
  const list = models[currentCat];
  thumbList.innerHTML = list.map((m,i) => `
    <div class="thumb-item${i === currentIdx ? ' active' : ''}" data-idx="${i}">
      <img class="thumb-img" src="${m.image}" alt="${m.name}" loading="lazy">
      <span class="thumb-label">${m.name.replace(/模型|飞机|桌子|动物|船只|人物/g,'')}</span>
    </div>
  `).join('');
  // scroll active into view
  const activeThumb = thumbList.querySelector('.thumb-item.active');
  if (activeThumb) activeThumb.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
}

function updateArrows() {
  const list = models[currentCat];
  prevBtn.disabled = currentIdx === 0;
  nextBtn.disabled = currentIdx >= list.length - 1;
}

/* ========== RENDER DB VIEW ========== */
function renderDB() {
  dbGrid.innerHTML = databases.map(d => `
    <div class="db-card">
      <div class="db-name">${d.name}</div>
      <span class="db-source">${d.source}</span>
      <div class="db-desc">${d.desc}</div>
    </div>
  `).join('');
}

/* ========== NAVIGATE ========== */
function selectCat(catId) {
  currentCat = catId;
  currentIdx = 0;
  renderSidebar();
  renderModel();
}

function prevModel() {
  if (currentIdx > 0) { currentIdx--; renderModel(); }
}
function nextModel() {
  const list = models[currentCat];
  if (currentIdx < list.length - 1) { currentIdx++; renderModel(); }
}

function selectModel(idx) {
  currentIdx = idx;
  renderModel();
}

/* ========== TAB SWITCH ========== */
function switchTab(tabId) {
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`[data-tab="${tabId}"]`).classList.add('active');
  if (tabId === 'model') {
    modelView.style.display = 'flex';
    dbView.style.display = 'none';
  } else {
    modelView.style.display = 'none';
    dbView.style.display = 'flex';
    renderDB();
  }
}

/* ========== EVENT LISTENERS ========== */
sidebar.addEventListener('click', e => {
  const catItem = e.target.closest('.cat-item');
  if (catItem) selectCat(catItem.dataset.cat);
});

thumbList.addEventListener('click', e => {
  const thumbItem = e.target.closest('.thumb-item');
  if (thumbItem) selectModel(parseInt(thumbItem.dataset.idx));
});

prevBtn.addEventListener('click', prevModel);
nextBtn.addEventListener('click', nextModel);

document.querySelectorAll('.nav-tab').forEach(tab => {
  tab.addEventListener('click', () => switchTab(tab.dataset.tab));
});

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prevModel();
  if (e.key === 'ArrowRight') nextModel();
});

/* ========== INIT ========== */
renderSidebar();
renderModel();
</script>

</body>
</html>
